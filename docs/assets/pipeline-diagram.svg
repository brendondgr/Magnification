<svg viewBox="0 0 1040 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Step 1: Job Boards -->
  <rect x="20" y="100" width="150" height="90" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="95" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">Job Boards</text>
  <text x="95" y="158" text-anchor="middle" font-size="11" fill="#57606a">LinkedIn, Indeed,</text>
  <text x="95" y="172" text-anchor="middle" font-size="11" fill="#57606a">Glassdoor, …</text>

  <line x1="170" y1="145" x2="215" y2="145" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Scraper -->
  <rect x="220" y="100" width="150" height="90" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="295" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#0969da">Scraper</text>
  <text x="295" y="158" text-anchor="middle" font-size="11" fill="#24292f">jobspy + concurrent</text>
  <text x="295" y="172" text-anchor="middle" font-size="11" fill="#24292f">LinkedIn fetch</text>

  <line x1="370" y1="145" x2="415" y2="145" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: SQLite -->
  <rect x="420" y="100" width="150" height="90" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="495" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">SQLite</text>
  <text x="495" y="158" text-anchor="middle" font-size="11" fill="#57606a">Jobs, Profile,</text>
  <text x="495" y="172" text-anchor="middle" font-size="11" fill="#57606a">JobAnalysis</text>

  <line x1="570" y1="145" x2="615" y2="145" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Hybrid Recommender -->
  <rect x="620" y="90" width="190" height="110" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="715" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#9a6700">Hybrid Recommender</text>
  <text x="715" y="140" text-anchor="middle" font-size="11" fill="#24292f">semantic (fastembed)</text>
  <text x="715" y="156" text-anchor="middle" font-size="11" fill="#24292f">+ BM25 + keyword groups</text>
  <text x="715" y="172" text-anchor="middle" font-size="11" fill="#24292f">+ optional LLM verdict</text>

  <line x1="810" y1="145" x2="855" y2="145" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Web UI -->
  <rect x="860" y="100" width="150" height="90" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="935" y="132" text-anchor="middle" font-size="15" font-weight="600" fill="#1a7f37">Web UI</text>
  <text x="935" y="152" text-anchor="middle" font-size="11" fill="#24292f">New / Saved</text>
  <text x="935" y="167" text-anchor="middle" font-size="11" fill="#24292f">Tracker (kanban)</text>

  <!-- Profile input feeding recommender -->
  <rect x="655" y="230" width="120" height="50" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="715" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">Résumé</text>
  <text x="715" y="265" text-anchor="middle" font-size="10" fill="#57606a">→ Profile (LLM)</text>
  <line x1="715" y1="230" x2="715" y2="200" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="520" y="30" text-anchor="middle" font-size="13" fill="#57606a">scrape → store → rank against your profile → review</text>
</svg>
